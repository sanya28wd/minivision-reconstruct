[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minivision-reconstruct"
version = "0.1.0"
description = "Evidence-preserving video ingestion for MiniVision-Reconstruct."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "Pillow>=10",
    "streamlit>=1.53,<2",
    "streamlit-drawable-canvas>=0.10,<1",
    "ultralytics>=8.3,<9",
    "lap>=0.5.12,<1",
    "pydantic>=2.10,<3",
    "starlette>=0.49,<1",
    "uvicorn>=0.34,<1",
    "playwright>=1.51,<2",
    "scipy>=1.13,<2",
    "shapely>=2.0,<3",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minivision_reconstruct" = ["pyproject.toml"]
"minivision_reconstruct.reconstruction" = ["component/frontend/dist/*"]
